[project]
name = "enterprise-multi-agent-sk"
version = "0.1.0"
description = "Sistema Multi-Agente Empresarial con Semantic Kernel y OpenRouter."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "semantic-kernel[openai]",
    "python-dotenv",
    "pydantic-settings",
    "httpx",
    "protobuf",
    "langchain-openai>=1.7.4",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "tomlscript",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tomlscript]
dev = "uv run uvicorn app.main:app --reload --port 8003"
test = "uv run pytest tests/ --cov=app --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]